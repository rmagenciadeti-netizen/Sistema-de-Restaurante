services:
  # API Express (Render). Migrations rodam ANTES de cada deploy com a conexão DIRETA do Neon (sem -pooler); a API usa a conexão com pooler.
  - type: web
    name: rm-restaurant-api
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace apps/api
    preDeployCommand: DATABASE_URL="$DATABASE_DIRECT_URL" npm run db:deploy
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: 22 }
      - { key: DATABASE_URL, sync: false }        # Neon, conexão com pooler, sslmode=require
      - { key: DATABASE_DIRECT_URL, sync: false } # Neon, conexão direta (somente migrations)
      - { key: JWT_SECRET, sync: false }
      - { key: MFA_ENCRYPTION_KEY, sync: false }
      - { key: FISCAL_ENCRYPTION_KEY, sync: false }
      # IA: opcional aqui. O provedor/modelo/chave podem ser definidos no RM Painel Admin › Serviços da plataforma (chave criptografada no banco).
      - { key: AI_PROVIDER, sync: false }
      - { key: AI_API_KEY, sync: false }
      - { key: AI_MODEL, sync: false }
      - { key: AI_BASE_URL, sync: false }
      - { key: CORS_ORIGIN, sync: false }         # origens exatas do Vercel (web e admin), sem *
      - { key: RM_RESTAURANT_URL, sync: false }
      - { key: RM_ADMIN_URL, sync: false }
      - { key: MIGRATION_BACKUP_DIR, value: /var/data/migration-backups }
      - { key: MIGRATION_BACKUP_ENCRYPTION_KEY, sync: false }
      - { key: MASTER_ADMIN_EMAIL, sync: false }
      - { key: MASTER_ADMIN_USERNAME, sync: false }
      - { key: MASTER_ADMIN_PASSWORD, sync: false }
    disk:
      name: migration-backups
      mountPath: /var/data
      sizeGB: 5
  # Worker (pedidos agendados, WhatsApp, automações). Um único processo; reinicia sozinho se cair.
  # Prova de funcionamento (não só "Live"): GET https://rm-restaurant-api.onrender.com/api/v1/health/worker  ->  200 {"status":"up",...}  (ver docs/DEPLOY.md).
  - type: worker
    name: rm-restaurant-worker
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace apps/api
    startCommand: npm run start:worker --workspace apps/api
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: 22 }
      # Mesmo banco e mesmas chaves da API, lidos do serviço rm-restaurant-api a cada sync do Blueprint: nada para copiar à mão e nenhum segredo no repositório.
      # (As chaves devem ser idênticas: a MFA_ENCRYPTION_KEY abre o pareamento do WhatsApp e a chave de IA gravados no banco.)
      - { key: DATABASE_URL, fromService: { type: web, name: rm-restaurant-api, envVarKey: DATABASE_URL } }
      - { key: MFA_ENCRYPTION_KEY, fromService: { type: web, name: rm-restaurant-api, envVarKey: MFA_ENCRYPTION_KEY } }
      - { key: RM_RESTAURANT_URL, fromService: { type: web, name: rm-restaurant-api, envVarKey: RM_RESTAURANT_URL } }
      # Opcionais (a IA do painel admin fica no banco e vale mesmo sem estas): preencha no painel da Render só se usar variáveis de ambiente.
      - { key: AI_PROVIDER, sync: false }
      - { key: AI_API_KEY, sync: false }
      - { key: AI_MODEL, sync: false }
      - { key: AI_BASE_URL, sync: false }
